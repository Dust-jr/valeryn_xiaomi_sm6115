name: Build Kernel on GitHub Actions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Update environment
      run: sudo apt update -y

    - name: Install Dependencies
      run: sudo apt install -y git build-essential zip unzip curl

    - name: Get script
      run: curl -o build_actions.sh -L https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/build-actions/build_actions.sh

    - name: Build kernel
      run: bash build_actions.sh
      continue-on-error: true

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          4.19*.zip
        name: kernel sukisu ${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: SukiSU kernel build
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
